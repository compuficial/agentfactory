name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Quality gates (format, lint, text/docs, govulncheck, crossbuild) —
  # tools pinned in tools/go.mod, run via `go tool -modfile`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: go mod tidy (main + tools) leaves no diff
        run: make mod && git diff --exit-code
      - name: repository text spelling
        run: make spell
      - name: shell syntax
        run: make shell
      - name: immutable workflow action refs
        run: make workflow
      - name: local documentation links
        run: make docs
      - name: gofumpt + goimports
        run: make fmt-check
      - name: golangci-lint
        run: make lint LINT_FLAGS=
      - name: govulncheck
        run: make vuln
      - name: crossbuild smoke
        run: make crossbuild
      - name: clean tree
        run: make diff

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...
