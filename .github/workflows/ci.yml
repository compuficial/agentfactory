name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Quality gates (golangci-lint, misspell, govulncheck, crossbuild) —
  # tools pinned in tools/go.mod, run via `go tool -modfile`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: go mod tidy (main + tools) leaves no diff
        run: make mod && git diff --exit-code
      - name: misspell (markdown)
        run: make spell
      - name: golangci-lint
        run: make lint LINT_FLAGS=
      - name: govulncheck
        run: make vuln
      - name: crossbuild smoke
        run: make crossbuild

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...
